schema: spec-driven

context: |
  URL Inspector: break down, edit, and rebuild URLs without losing detail (encoding,
  param order, duplicate keys, empty values, fragments).

  Constraints: client-only (no backend), anonymous (no analytics/tracking/cookies/
  third-party CDNs), minimal, lossless round-tripping. Runtime dependencies must be
  minimal, bundled into the static build, and self-hosted (no CDN); each new one
  needs explicit user approval.

  Stack: Bun (package manager, dev server, bundler, test runner), TypeScript strict,
  Preact + @preact/signals, Pico CSS, Biome (lint/format), lefthook (pre-commit).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
